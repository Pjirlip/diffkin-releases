name: Documentation issue
description: Something in the documentation is missing, wrong or unclear.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The documentation page or in-app text concerned.
      placeholder: docs/user/crawling.md, "Route identity"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording (optional)
